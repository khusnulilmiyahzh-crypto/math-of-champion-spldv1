<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math of Champion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #38bdf8);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            padding: 45px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            backdrop-filter: blur(10px);
        }

        .trophy {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .start-button {
            display: inline-block;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            background: white;
            color: #1e3a8a;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }

        .start-button:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .trophy {
                font-size: 55px;
            }

            .container {
                padding: 35px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="trophy">🏆</div>

        <h1>MATH OF CHAMPION</h1>

        <div class="subtitle">
            Interactive Mathematics Competition Game
        </div>

        <div class="description">
            Tantang kemampuan matematika kamu,
            pecahkan soal, kumpulkan poin,
            dan jadilah juara dalam Math of Champion!
        </div>

        <button class="start-button" onclick="mulaiGame()">
            MULAI PERMAINAN
        </button>

        <div class="footer">
            Mathematics Competition • Math of Champion
        </div>

    </div>

    <script>
        function mulaiGame() {
            alert("Selamat datang di Math of Champion! Permainan akan segera dimulai.");
        }
    </script>

</body>
</html>
