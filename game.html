<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math of Champion - Game</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3a8a, #2563eb, #38bdf8);
            padding: 20px;
            color: #222;
        }

        .game-container {
            max-width: 750px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e3a8a;
            margin-bottom: 8px;
        }

        .player {
            color: #555;
            margin-bottom: 20px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 25px;
        }

        .status-box {
            flex: 1;
            background: #eff6ff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
        }

        .question-number {
            color: #2563eb;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question {
            font-size: 20px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            width: 100%;
            padding: 15px;
            border: 2px solid #dbeafe;
            background: white;
            border-radius: 12px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            background: #eff6ff;
            border-color: #2563eb;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #16a34a;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #dc2626;
        }

        .next-button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #1e3a8a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .next-button:hover {
            background: #172554;
        }

        .result {
            text-align: center;
            display: none;
        }

        .result h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        .result-score {
            font-size: 35px;
            font-weight: bold;
            margin: 20px 0;
        }

        .restart-button {
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .game-container {
                padding: 20px;
            }

            .status {
                flex-direction: column;
            }

            .question {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <div id="game">

        <div class="header">
            <h1>🏆 Math of Champion</h1>
            <div class="player">
    Pemain: <span id="playerName">Champion</span>
    <br>
    Kelas: <span id="playerClass">-</span>
            </div>
        </div>

        <div class="status">
            <div class="status-box">
                Soal<br>
                <span id="questionNumber">1</span>/5
            </div>

            <div class="status-box">
                Poin<br>
                <span id="score">0</span>
            </div>

            <div class="status-box">
                Waktu<br>
                <span id="timer">60</span> detik
            </div>
        </div>

        <div class="question-number">
            Pertanyaan
        </div>

        <div class="question" id="question">
            Memuat soal...
        </div>

        <div class="options" id="options"></div>

        <button class="next-button" id="nextButton" onclick="nextQuestion()" style="display:none;">
            SOAL BERIKUTNYA →
        </button>

    </div>

    <div class="result" id="result">

        <h2>🎉 Permainan Selesai!</h2>

        <p>Selamat! Kamu telah menyelesaikan permainan.</p>

        <div class="result-score">
            <span id="finalScore">0</span> Poin
        </div>

        <button class="restart-button" onclick="location.reload()">
            MAIN LAGI
        </button>

    </div>

</div>

</script>

</body>
  </html>
